name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Report the pinned language revision
        run: git -C vendor/kofun log -1 --format='vendor/kofun is at %h %s'
      - run: sh vendor/kofun/tooling/kotest/run.sh seed/router/core_test.kofun

  gate:
    name: Boot gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sh tests/boot/check.sh

  serve:
    name: Integration — a real server on a real socket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sh tests/integration/serve.sh
